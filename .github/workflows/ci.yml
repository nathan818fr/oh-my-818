name: CI

# The tests, on main and on pull requests (a branch of a PR runs once, as the PR), unless a change
# only touches what they don't use. Tags don't run them: a release is a commit main already tested
on:
  push:
    branches: [main]
    paths-ignore: &not-tested
      - "docs/**"
      - "**.md"
      - LICENSE
      - .github/prompt.png
  pull_request:
    paths-ignore: *not-tested

defaults:
  run:
    shell: bash

permissions:
  contents: read

# A newer push to the same PR cancels its run in progress. A push to main is never cancelled
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install zsh and tmux (and bash 4.4+ on macOS)
        run: |
          # (tmux: the terminal tests)
          if [[ "$RUNNER_OS" == 'Linux' ]]; then
            sudo apt-get update && sudo apt-get install -y zsh tmux
          else
            # bash 4.4+ to run the tests, which use it for the bash module too (macOS ships 3.2)
            HOMEBREW_NO_AUTO_UPDATE=1 brew install bash tmux
          fi
      - name: Test
        run: bash tests/run

  # The oldest bash oh-my-818 supports, on Alpine (busybox's tools, no GNU coreutils)
  test-bash-4-4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test
        run: |
          # As a user: root ignores read-only files, which the tests check. Without Docker's
          # marker: the prompt would show (docker) where the tests expect no environment
          docker run --rm -v "${PWD}:/src:ro" docker.io/library/bash:4.4 sh -c \
            'rm /.dockerenv && apk add --no-cache git zsh tmux >/dev/null && adduser -D tester &&
            cp -r /src /home/tester/src && chown -R tester /home/tester/src &&
            su tester -s /bin/sh -c "cd ~/src && bash tests/run"'
